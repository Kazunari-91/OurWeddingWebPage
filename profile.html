<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | Wedding</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root{--bg:#fffaf3;--card:#fff;--ink:#3f342c;--sub:#7f6b5d;--accent:#c97947;--line:#ead8c8}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}
    .wrap{max-width:760px;margin:auto;padding:26px 18px 48px}
    .back{text-decoration:none;color:var(--accent);font-size:14px}
    h1{font-family:Georgia,serif;font-weight:500;font-size:34px;margin:26px 0 22px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .person{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
    .avatar{height:190px;border-radius:14px;background:#f1e4d8;display:grid;place-items:center;font-size:64px;margin-bottom:18px}
    h2{margin:0 0 10px}.meta{color:var(--sub);line-height:1.8}
    .story{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;line-height:1.9}
    .corner{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 18px 8px}
    .corner h2{font-family:Georgia,serif;font-weight:500;font-size:26px;margin:0 0 6px}
    .lead{margin:0 0 4px;color:var(--sub);font-size:14px;line-height:1.8}
    .block{padding:16px 0 14px;border-top:1px solid var(--line)}
    .block h3{margin:0 0 12px;font-size:16px;letter-spacing:.06em}
    .subblock + .subblock{margin-top:14px}
    .block h4{margin:0 0 10px;font-size:14px;font-weight:600;letter-spacing:.08em;color:var(--sub)}
    .scroller{position:relative}
    .strip{
      display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
      scrollbar-width:none;overscroll-behavior-x:contain;padding:2px 0 8px;touch-action:manipulation
    }
    .strip::-webkit-scrollbar{display:none}
    .photo{
      flex:0 0 calc((100% - 10px) / 2.25);scroll-snap-align:start;
      position:relative;aspect-ratio:1/1;border:0;border-radius:14px;
      background:linear-gradient(145deg,#ead6c4,#f8eee5);
      color:var(--sub);font:inherit;font-size:12px;padding:0;overflow:hidden;cursor:pointer
    }
    .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .photo .label{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:8px;line-height:1.5}
    .photo.has-image .label{display:none}
    .nudge{
      display:none;position:absolute;top:50%;transform:translateY(-58%);
      z-index:1;width:36px;height:36px;border-radius:50%;
      border:1px solid var(--line);background:#fff;color:var(--ink);
      place-items:center;font-size:22px;line-height:1;cursor:pointer;padding:0
    }
    .nudge.prev{left:8px}
    .nudge.next{right:8px}
    body.viewer-open{overflow:hidden}
    .viewer{
      border:0;padding:0;margin:0;width:100%;height:100%;max-width:none;max-height:none;
      background:transparent;color:#fff
    }
    .viewer::backdrop{background:rgba(36,28,22,.92)}
    .viewer-close{
      position:absolute;top:16px;right:16px;border:0;background:transparent;color:#fff;
      font:inherit;font-size:15px;cursor:pointer;padding:8px 4px
    }
    .viewer-stage{height:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:64px 12px 72px}
    .viewer-frame{flex:1;min-width:0;height:100%;display:grid;place-items:center}
    .viewer-frame img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
    .viewer-ph{
      width:min(420px,100%);aspect-ratio:1/1;border-radius:14px;
      background:linear-gradient(145deg,#ead6c4,#f8eee5);color:var(--sub);
      display:grid;place-items:center;text-align:center;padding:18px;line-height:1.7
    }
    .viewer.has-image .viewer-ph{display:none}
    .viewer:not(.has-image) .viewer-frame img{display:none}
    .viewer-nav{
      flex:none;width:42px;height:42px;border-radius:50%;
      border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);
      color:#fff;font-size:26px;line-height:1;cursor:pointer
    }
    .viewer-nav[hidden]{display:none}
    .viewer-count{position:absolute;left:0;right:0;bottom:22px;margin:0;text-align:center;font-size:14px;letter-spacing:.08em}
    @media(max-width:560px){.grid{grid-template-columns:1fr}}
    @media(min-width:640px){.photo{flex-basis:calc((100% - 20px) / 3.25)}}
    @media(min-width:700px){.nudge{display:grid}}
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" id="backLink" href="index.html">← Topへ戻る</a>
    <h1>Profile</h1>

    <section class="grid">
      <article class="person">
        <div class="avatar">🤵</div>
        <h2>新郎</h2>
        <div class="meta">名前：津田 一成<br>好きなこと：ものづくり<br>ひとこと：今日は来てくれてありがとうございます。</div>
      </article>
      <article class="person">
        <div class="avatar">👰</div>
        <h2>新婦</h2>
        <div class="meta">名前：津田 白保<br>好きなこと：ネイル<br>ひとこと：ゆっくり楽しんでください。</div>
      </article>
    </section>

    <section class="story">
      <strong>About us</strong><br>
      ここには「出会い」「付き合い始めた時期」「思い出」「入籍」など、
    </section>

    <section class="corner" aria-labelledby="photoCornerTitle">
      <h2 id="photoCornerTitle">写真で見るふたり</h2>
      <p class="lead">これまでの写真と、それぞれの趣味です。</p>

      <div class="block">
        <h3>これまでの写真</h3>
        <div class="subblock">
          <h4>新郎</h4>
          <div class="scroller">
            <button class="nudge prev" type="button" aria-label="前の写真">‹</button>
            <div class="strip" data-group="history_k" tabindex="0"></div>
            <button class="nudge next" type="button" aria-label="次の写真">›</button>
          </div>
        </div>
        <div class="subblock">
          <h4>新婦</h4>
          <div class="scroller">
            <button class="nudge prev" type="button" aria-label="前の写真">‹</button>
            <div class="strip" data-group="history_s" tabindex="0"></div>
            <button class="nudge next" type="button" aria-label="次の写真">›</button>
          </div>
        </div>
      </div>

      <div class="block">
        <h3>一成の趣味</h3>
        <div class="scroller">
          <button class="nudge prev" type="button" aria-label="前の写真">‹</button>
          <div class="strip" data-group="hobby_k" tabindex="0"></div>
          <button class="nudge next" type="button" aria-label="次の写真">›</button>
        </div>
      </div>

      <div class="block">
        <h3>白保の趣味</h3>
        <div class="scroller">
          <button class="nudge prev" type="button" aria-label="前の写真">‹</button>
          <div class="strip" data-group="hobby_s" tabindex="0"></div>
          <button class="nudge next" type="button" aria-label="次の写真">›</button>
        </div>
      </div>
    </section>
  </main>

  <dialog class="viewer" id="viewer">
    <button class="viewer-close" id="viewerClose" type="button">閉じる</button>
    <div class="viewer-stage">
      <button class="viewer-nav" id="viewerPrev" type="button" aria-label="前の写真">‹</button>
      <div class="viewer-frame">
        <img id="viewerImg" alt="">
        <div class="viewer-ph" id="viewerPh"></div>
      </div>
      <button class="viewer-nav" id="viewerNext" type="button" aria-label="次の写真">›</button>
    </div>
    <p class="viewer-count" id="viewerCount"></p>
  </dialog>
<script>
const guest = new URLSearchParams(location.search).get("guest");
if (guest) document.getElementById("backLink").href = "index.html?guest=" + encodeURIComponent(guest);

// 枚数だけ変える。画像は images/history_k/01.jpg のように、各フォルダへ 01.jpg から順に置きます。
const photoGroups = {
  history_k: { title: "新郎のこれまでの写真", count: 4 },
  history_s: { title: "新婦のこれまでの写真", count: 4 },
  hobby_k: { title: "一成の趣味", count: 3 },
  hobby_s: { title: "白保の趣味", count: 3 }
};

function photoSrc(groupId, index){
  return `images/${groupId}/${String(index + 1).padStart(2, "0")}.jpg`;
}

function makeSlide(groupId, index){
  const group = photoGroups[groupId];
  const button = document.createElement("button");
  button.type = "button";
  button.className = "photo";
  button.setAttribute("aria-label", `${group.title}の写真 ${index + 1} を拡大`);
  const img = document.createElement("img");
  img.alt = "";
  img.draggable = false;
  img.src = photoSrc(groupId, index);
  const label = document.createElement("span");
  label.className = "label";
  label.textContent = `写真 ${index + 1}`;
  img.addEventListener("load", () => button.classList.add("has-image"));
  img.addEventListener("error", () => img.remove());
  button.append(img, label);
  button.addEventListener("click", () => {
    const strip = button.closest(".strip");
    const dragged = strip.dataset.dragged === "1";
    strip.dataset.dragged = "0";
    if (dragged) return;
    openViewer(groupId, index);
  });
  return button;
}

function loopBounds(strip, count){
  const start = strip.children[count].offsetLeft;
  const end = strip.children[count * 2].offsetLeft;
  return { start, end, width: end - start };
}

function parkInMiddle(strip, count){
  const { start, width } = loopBounds(strip, count);
  if (width <= 0) return;
  const within = ((strip.scrollLeft - start) % width + width) % width;
  strip.scrollLeft = start + within;
}

document.querySelectorAll(".strip").forEach((strip) => {
  const groupId = strip.dataset.group;
  const count = photoGroups[groupId]?.count ?? 0;
  const scroller = strip.parentElement;
  if (count < 1) return;

  const appendCopy = () => {
    for (let index = 0; index < count; index += 1) strip.append(makeSlide(groupId, index));
  };
  appendCopy();
  appendCopy();
  appendCopy();
  let guard = 0;
  while (guard < 8) {
    const { end } = loopBounds(strip, count);
    if (end <= 0) break;
    if (strip.scrollWidth - strip.clientWidth >= end) break;
    appendCopy();
    guard += 1;
  }

  const stride = () => strip.children[1].offsetLeft - strip.children[0].offsetLeft;
  let queued = false;
  let pending = null;
  const keepLooping = () => {
    const { start, end, width } = loopBounds(strip, count);
    if (width <= 0) return;
    if (strip.scrollLeft >= start - 1 && strip.scrollLeft < end - 1) return;
    const within = ((strip.scrollLeft - start) % width + width) % width;
    pending = start + within;
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => {
      queued = false;
      if (pending == null) return;
      const next = pending;
      pending = null;
      strip.scrollLeft = next;
      keepLooping();
    });
  };

  requestAnimationFrame(() => { strip.scrollLeft = loopBounds(strip, count).start; });
  strip.addEventListener("scroll", () => {
    if (Math.abs(strip.scrollLeft - Number(strip.dataset.pointerLeft || strip.scrollLeft)) > 6) {
      strip.dataset.dragged = "1";
    }
    keepLooping();
  }, { passive: true });
  strip.addEventListener("pointerdown", () => {
    strip.dataset.dragged = "0";
    strip.dataset.pointerLeft = String(strip.scrollLeft);
  });
  window.addEventListener("resize", () => parkInMiddle(strip, count));

  scroller.querySelector(".prev").addEventListener("click", () => {
    strip.scrollBy({ left: -stride(), behavior: "smooth" });
  });
  scroller.querySelector(".next").addEventListener("click", () => {
    strip.scrollBy({ left: stride(), behavior: "smooth" });
  });
  strip.addEventListener("keydown", (event) => {
    if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
    event.preventDefault();
    strip.scrollBy({ left: event.key === "ArrowRight" ? stride() : -stride(), behavior: "smooth" });
  });
});

const viewer = document.getElementById("viewer");
const viewerImg = document.getElementById("viewerImg");
const viewerPh = document.getElementById("viewerPh");
const viewerCount = document.getElementById("viewerCount");
const viewerPrev = document.getElementById("viewerPrev");
const viewerNext = document.getElementById("viewerNext");
let viewerGroup = "";
let viewerIndex = 0;
let viewerReturn = null;

function renderViewer(){
  const group = photoGroups[viewerGroup];
  const src = photoSrc(viewerGroup, viewerIndex);
  viewer.classList.remove("has-image");
  viewerPh.textContent = `${group.title} · 写真 ${viewerIndex + 1}`;
  viewerImg.alt = `${group.title}の写真 ${viewerIndex + 1}`;
  viewerImg.src = src;
  viewerCount.textContent = `${group.title} · ${viewerIndex + 1} / ${group.count}`;
  const single = group.count < 2;
  viewerPrev.hidden = single;
  viewerNext.hidden = single;
}

function openViewer(groupId, index){
  viewerGroup = groupId;
  viewerIndex = index;
  viewerReturn = document.activeElement;
  renderViewer();
  viewer.showModal();
  document.body.classList.add("viewer-open");
}

function stepViewer(delta){
  const count = photoGroups[viewerGroup]?.count ?? 0;
  if (count < 1) return;
  viewerIndex = (viewerIndex + delta + count) % count;
  renderViewer();
}

viewerImg.addEventListener("load", () => viewer.classList.add("has-image"));
viewerImg.addEventListener("error", () => viewer.classList.remove("has-image"));
document.getElementById("viewerClose").addEventListener("click", () => viewer.close());
viewerPrev.addEventListener("click", () => stepViewer(-1));
viewerNext.addEventListener("click", () => stepViewer(1));
viewer.addEventListener("close", () => {
  document.body.classList.remove("viewer-open");
  if (viewerReturn instanceof HTMLElement) viewerReturn.focus();
});
viewer.addEventListener("click", (event) => {
  if (event.target === viewer || event.target.classList.contains("viewer-stage") || event.target.classList.contains("viewer-frame")) {
    viewer.close();
  }
});
viewer.addEventListener("keydown", (event) => {
  if (event.key === "ArrowRight") { event.preventDefault(); stepViewer(1); }
  if (event.key === "ArrowLeft") { event.preventDefault(); stepViewer(-1); }
});

let swipeX = 0;
let swipeY = 0;
viewer.addEventListener("pointerdown", (event) => {
  if (event.target.closest("button")) return;
  swipeX = event.clientX;
  swipeY = event.clientY;
});
viewer.addEventListener("pointerup", (event) => {
  if (event.target.closest("button")) return;
  const dx = event.clientX - swipeX;
  const dy = event.clientY - swipeY;
  if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy)) return;
  stepViewer(dx < 0 ? 1 : -1);
});
</script>
</body>
</html>
